<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClaimPilot AI — Autonomous Motor Insurance Claim Review</title>
  <meta name="description" content="Next-generation autonomous motor insurance claim intake and multi-source cost reconciliation engine.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#F0F4FF',
              100: '#E0E8FF',
              200: '#C7D4FE',
              300: '#A5B9FD',
              400: '#8193FA',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#3A30B8',
              800: '#2A2985',
              900: '#1E2761',
              950: '#141B41',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased min-h-screen text-slate-800">

  <!-- Ambient Light Mesh Gradient & Orbs -->
  <div class="mesh-bg">
    <div class="mesh-orb mesh-orb-1"></div>
    <div class="mesh-orb mesh-orb-2"></div>
    <div class="mesh-orb mesh-orb-3"></div>
  </div>

  <!-- Top Glassmorphic Navigation Bar -->
  <header class="sticky top-0 z-40 glass-header px-4 sm:px-8 py-3.5">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Logo & Brand Badge -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-950 via-indigo-900 to-indigo-700 text-white flex items-center justify-center shadow-md shadow-indigo-950/20 border border-white/40">
          <i data-lucide="shield-check" class="w-5 h-5 text-indigo-200"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-display font-extrabold text-xl text-slate-900 tracking-tight">ClaimPilot<span class="text-indigo-700">.ai</span></span>
            <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-100/90 text-indigo-950 px-2 py-0.5 rounded-full border border-indigo-200">
              Autonomous v2.4
            </span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium">Motor OD Intake &amp; Multi-Model Adjudication</p>
        </div>
      </div>

      <!-- Navigation Tabs & Scenario Selector -->
      <div class="flex flex-wrap items-center gap-3">
        
        <!-- Screen Switcher Tabs -->
        <nav class="flex items-center p-1 rounded-2xl glass-subcard border border-white/80 shadow-xs" aria-label="Main Navigation">
          <button id="nav-btn-submission" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 bg-indigo-900 text-white shadow-sm">
            <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i>
            <span>1. Claim Intake</span>
          </button>
          <button id="nav-btn-dashboard" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100/60 transition-all flex items-center gap-1.5">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
            <span>2. Case Summary</span>
          </button>
        </nav>

        <!-- Live Demo Scenario Switcher -->
        <div class="flex items-center gap-1.5 bg-white/80 border border-indigo-200/80 rounded-2xl px-3 py-1 shadow-sm">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider hidden md:inline">Scenario:</span>
          <select id="scenario-select" class="bg-transparent text-xs font-bold text-indigo-950 focus:outline-none cursor-pointer py-1">
            <!-- Options populated dynamically by JS -->
          </select>
        </div>

      </div>

    </div>
  </header>

  <!-- Main Application Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-8">
    <div id="app-content">
      <!-- Screen content rendered here by js/app.js -->
    </div>
  </main>

  <!-- Modal Container -->
  <div id="app-modal" class="hidden"></div>

  <!-- Toast Notification Container -->
  <div id="app-toast" class="fixed bottom-6 right-6 z-50 hidden"></div>

  <!-- Scripts -->
  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
