<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClaimPilot AI — Autonomous Motor Insurance Claim Adjudication</title>
  <meta name="description" content="Production autonomous motor insurance claim intake, multi-agent cost reconciliation, and forensic fraud detection engine.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: {
              50: '#F0F4FF',
              100: '#E0E8FF',
              200: '#C7D4FE',
              300: '#A5B9FD',
              400: '#8193FA',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#3A30B8',
              800: '#2A2985',
              900: '#1E2761',
              950: '#141B41',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased min-h-screen text-slate-800">

  <!-- Ambient Light Mesh Gradient & Floating Orbs -->
  <div class="mesh-bg">
    <div class="mesh-orb mesh-orb-1"></div>
    <div class="mesh-orb mesh-orb-2"></div>
    <div class="mesh-orb mesh-orb-3"></div>
  </div>

  <!-- Dynamic Glassmorphic Navigation Header -->
  <header class="sticky top-0 z-40 glass-header px-4 sm:px-8 py-3"></header>

  <!-- Main Application Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-6 sm:py-8">
    <div id="app-content">
      <!-- Views rendered dynamically by js/app.js -->
    </div>
  </main>

  <!-- Modal Container -->
  <div id="app-modal" class="hidden"></div>

  <!-- Toast Notification Container -->
  <div id="app-toast" class="fixed bottom-6 right-6 z-50 hidden"></div>

  <!-- Application Scripts -->
  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
