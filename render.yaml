version: "3"

services:
  # 1. Orchestrator (Public Web Service)
  - type: web
    name: claimpilot-orchestrator
    env: python
    buildCommand: "pip install -r orchestrator/requirements.txt"
    startCommand: "uvicorn orchestrator.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DOCUMENT_AGENT_URL
        value: "http://claimpilot-document-agent:10000"
      - key: IMAGE_AGENT_URL
        value: "http://claimpilot-image-agent:10000"
      - key: COST_AGENT_URL
        value: "http://claimpilot-cost-agent:10000/api/cost/estimate"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # 2. Document Agent (Private Service)
  - type: pserv
    name: claimpilot-document-agent
    env: python
    buildCommand: "pip install -r document_agent/requirements.txt"
    startCommand: "cd document_agent && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false

  # 3. Image Agent (Private Service)
  - type: pserv
    name: claimpilot-image-agent
    env: python
    buildCommand: "pip install -r image_agent/requirements.txt"
    startCommand: "cd image_agent && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false

  # 4. Cost Agent (Private Service - Java Spring Boot)
  - type: pserv
    name: claimpilot-cost-agent
    env: docker
    dockerfilePath: ./cost-agent-spring-ai/Dockerfile
    envVars:
      - key: PORT
        value: "10000"
